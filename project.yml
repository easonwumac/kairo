name: Kairo
options:
  bundleIdPrefix: app.kairo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  KairoCore:
    path: .
targets:
  KairoApp:
    type: application
    platform: iOS
    sources:
      - path: Kairo/App
      - path: Kairo/Views
      - path: Kairo/Resources
    dependencies:
      - package: KairoCore
        product: KairoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kairo.ios
        INFOPLIST_FILE: Config/KairoApp-Info.plist
  KairoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Kairo/Extensions/ShareExtension
    dependencies:
      - package: KairoCore
        product: KairoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kairo.ios.share
        INFOPLIST_FILE: Config/KairoShareExtension-Info.plist
  KairoCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: KairoCore
        product: KairoCore

name: Kairo
options:
  bundleIdPrefix: app.kairo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  KairoCore:
    path: .
targets:
  KairoApp:
    type: application
    platform: iOS
    sources:
      - path: Kairo/App
      - path: Kairo/Resources
    dependencies:
      - package: KairoCore
        product: KairoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kairo.ios
        INFOPLIST_FILE: Config/KairoApp-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/KairoApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KairoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Kairo/Extensions/ShareExtension
    dependencies:
      - package: KairoCore
        product: KairoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kairo.ios.share
        INFOPLIST_FILE: Config/KairoShareExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/KairoShareExtension.entitlements
  KairoCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: KairoCore
        product: KairoCore
  KairoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KairoUITests
    dependencies:
      - target: KairoApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kairo.ios.uitests
